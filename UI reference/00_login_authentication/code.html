<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <main class="min-h-[1024px] grid grid-cols-1 lg:grid-cols-12" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <!-- Left Section: Bixcel Brand Identity -->
    <section class="lg:col-span-6 bg-sidebar text-on-sidebar p-8 sm:p-12 lg:p-16 flex flex-col justify-between gap-10">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded bg-sidebar-active flex items-center justify-center shadow-sm">
          <span class="material-symbols-outlined text-on-sidebar text-[22px]">school</span>
        </div>
        <div>
          <span data-design-text-token="title-lg" class="font-title text-title-lg text-on-sidebar block">Bixcel</span>
        </div>
      </div>

      <div class="max-w-md w-full my-auto mx-auto">
        <div class="rounded-md overflow-hidden border border-sidebar-surface bg-sidebar-surface">
          <img src="https://lh3.googleusercontent.com/aida/ALJJyrCfJWcI_scPMRyNqo2ZwHuoS9ywzoNPksO_uLPji4cE8a49P5YtR8wA21EdIkgs8VnKOl1o460zIGiR0bgc9KBsa6Kr0c8D4lO3XOWDd-9l1Tcsch_vhJyysmfpEQPeXofXqcE_KGzfBcA770tISLE-5UJaOANtfk_6qMKO3JSY7sWYQScNH_1Y_hwpDQCk40H2MR1abRNq5_5YF-58Yw91lToGFsZXPlsT4Wqv8ZImV9-oBsMxuzFfnJGcGHoyCiPS" alt="Bixcel academic network illustration" class="w-full h-64 object-cover">
        </div>
      </div>

      <div aria-hidden="true"></div>
    </section>

    <!-- Right Section: Login Form Card -->
    <section class="lg:col-span-6 relative overflow-hidden bg-light-surface p-6 sm:p-12 flex items-center justify-center" style="background-image: radial-gradient(#CBD5E1 1px, transparent 1px); background-size: 24px 24px;">
      <!-- Subtle architectural corner accents -->
      <div aria-hidden="true" class="pointer-events-none absolute -top-24 -right-24 w-80 h-80 rounded-full border border-light-outline-variant bg-light-primary-tint/50"></div>
      <div aria-hidden="true" class="pointer-events-none absolute -bottom-28 -left-24 w-72 h-72 rounded-full border border-light-outline-variant bg-light-surface-container-low/70"></div>

      <div class="relative z-10 w-full max-w-md bg-light-surface-container-lowest border border-light-outline-variant rounded-lg shadow-md overflow-hidden">
        <div class="p-8 sm:p-10 flex flex-col gap-6">
          <header class="flex items-center justify-between gap-4">
            <h2 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface">Welcome Back</h2>
            <span class="w-9 h-9 rounded-full bg-light-primary-tint text-light-primary inline-flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined text-[18px]">lock</span>
            </span>
          </header>

        <form id="loginForm" class="flex flex-col gap-5" onsubmit="handleLogin(event)">
          <!-- COMPONENT: input-field-icon -->
          <label data-component-id="input-field-icon" data-component-type="input-field" data-component-variant="with-icon" class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Email or Username</span>
            <div class="relative flex items-center">
              <span aria-hidden="true" class="material-symbols-outlined text-light-outline text-[18px] absolute left-3.5 pointer-events-none">mail</span>
              <input id="emailInput" type="text" required value="elena.rostova@bixcel.edu" placeholder="name@bixcel.edu" class="w-full pl-10 pr-3.5 py-2.5 rounded border border-light-outline-variant bg-light-surface-container-lowest text-light-on-surface font-body text-body-md placeholder:text-light-outline focus:border-light-primary focus:ring-2 focus:ring-light-primary-tint focus:outline-none transition-colors duration-state-change">
            </div>
          </label>

          <!-- Password input with show/hide icon -->
          <label data-component-id="input-field-password" data-component-type="input-field" data-component-variant="password" class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Password</span>
            <div class="relative flex items-center">
              <span aria-hidden="true" class="material-symbols-outlined text-light-outline text-[18px] absolute left-3.5 pointer-events-none">lock</span>
              <input id="passwordInput" type="password" required value="••••••••••••" autocomplete="current-password" placeholder="Enter your password" class="w-full pl-10 pr-10 py-2.5 rounded border border-light-outline-variant bg-light-surface-container-lowest text-light-on-surface font-body text-body-md placeholder:text-light-outline focus:border-light-primary focus:ring-2 focus:ring-light-primary-tint focus:outline-none transition-colors duration-state-change">
              <button type="button" onclick="togglePassword()" aria-label="Toggle password visibility" class="absolute right-2.5 p-1 rounded text-light-outline hover:text-light-on-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary">
                <span id="passwordToggleIcon" class="material-symbols-outlined text-[18px]">visibility</span>
              </button>
            </div>
          </label>

          <div class="flex items-center justify-between gap-4">
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked class="w-4 h-4 rounded-sm border-light-outline-variant text-light-primary focus:ring-light-primary">
              <span data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">Remember me</span>
            </label>
            <a href="../forgot-password/ForgotPassword.html" data-design-text-token="label-md" class="font-label text-label-md text-light-primary hover:underline">Forgot password?</a>
          </div>

          <!-- COMPONENT: button-primary -->
          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded bg-light-primary text-light-on-primary shadow-sm hover:bg-light-primary-container focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary focus-visible:ring-offset-2 transition-colors duration-state-change ease-state-change">
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Sign In</span>
          </button>
        </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('passwordToggleIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.toLowerCase();
      if (email.includes('marcus')) {
        window.location.href = '../tutor-dashboard/TutorDashboard.html';
      } else if (email.includes('aarav')) {
        window.location.href = '../student-dashboard/StudentDashboard.html';
      } else {
        window.location.href = '../executive-dashboard/ExecutiveDashboard.html';
      }
    }
  </script>


</body></html>
