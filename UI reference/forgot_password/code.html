  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <main class="min-h-[1024px] grid grid-cols-1 lg:grid-cols-12" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <!-- Left Section: Bixcel Brand Identity (matches LoginAuthentication.html) -->
    <section class="lg:col-span-6 bg-sidebar text-on-sidebar p-8 sm:p-12 lg:p-16 flex flex-col justify-between gap-10">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded bg-sidebar-active flex items-center justify-center shadow-sm">
          <span class="material-symbols-outlined text-on-sidebar text-[22px]">school</span>
        </div>
        <div>
          <span data-design-text-token="title-lg" class="font-title text-title-lg text-on-sidebar block">Bixcel</span>
        </div>
      </div>

      <div class="max-w-md w-full my-auto mx-auto">
        <div class="rounded-md overflow-hidden border border-sidebar-surface bg-sidebar-surface">
          <img src="https://lh3.googleusercontent.com/aida/ALJJyrCfJWcI_scPMRyNqo2ZwHuoS9ywzoNPksO_uLPji4cE8a49P5YtR8wA21EdIkgs8VnKOl1o460zIGiR0bgc9KBsa6Kr0c8D4lO3XOWDd-9l1Tcsch_vhJyysmfpEQPeXofXqcE_KGzfBcA770tISLE-5UJaOANtfk_6qMKO3JSY7sWYQScNH_1Y_hwpDQCk40H2MR1abRNq5_5YF-58Yw91lToGFsZXPlsT4Wqv8ZImV9-oBsMxuzFfnJGcGHoyCiPS" alt="Bixcel academic network illustration" class="w-full h-64 object-cover">
        </div>
      </div>

      <div aria-hidden="true"></div>
    </section>

    <!-- Right Section: Forgot Password Card -->
    <section class="lg:col-span-6 bg-light-surface p-6 sm:p-12 flex items-center justify-center">
      <div class="w-full max-w-md bg-light-surface-container-lowest border border-light-outline-variant rounded-lg shadow-sm p-8 sm:p-10 flex flex-col gap-6">
        <header>
          <h2 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface">Reset Password</h2>
        </header>

        <form id="resetForm" class="flex flex-col gap-5" onsubmit="handleReset(event)">
          <!-- COMPONENT: input-field-icon -->
          <label data-component-id="input-field-icon" data-component-type="input-field" data-component-variant="with-icon" class="flex flex-col gap-1.5">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Institutional Email</span>
            <div class="relative flex items-center">
              <span aria-hidden="true" class="material-symbols-outlined text-light-outline text-[18px] absolute left-3.5 pointer-events-none">mail</span>
              <input id="resetEmailInput" type="email" required placeholder="name@bixcel.edu" inputmode="email" class="w-full pl-10 pr-3.5 py-2.5 rounded border border-light-outline-variant bg-light-surface-container-lowest text-light-on-surface font-body text-body-md placeholder:text-light-outline focus:border-light-primary focus:ring-2 focus:ring-light-primary-tint focus:outline-none transition-colors duration-state-change">
            </div>
          </label>

          <!-- COMPONENT: button-primary -->
          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded bg-light-primary text-light-on-primary shadow-sm hover:bg-light-primary-container focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary focus-visible:ring-offset-2 transition-colors duration-state-change ease-state-change">
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Send Reset Link</span>
          </button>
        </form>

        <!-- Confirmation state (hidden until submitted) -->
        <div id="resetConfirmation" class="hidden p-4 rounded bg-success-container text-on-success-container flex items-start gap-3" role="status">
          <span class="material-symbols-outlined text-[20px] shrink-0">check_circle</span>
          <div class="flex flex-col gap-1">
            <span data-design-text-token="label-md" class="font-label text-label-md">Reset link sent</span>
            <span id="resetConfirmText" data-design-text-token="body-sm" class="font-body text-body-sm">Check your inbox for instructions to reset your password.</span>
          </div>
        </div>

        <div class="pt-2 border-t border-light-outline-variant flex items-center justify-center">
          <a href="../login-authentication/LoginAuthentication.html" class="inline-flex items-center gap-1.5 font-label text-label-md text-light-primary hover:underline">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">arrow_back</span>
            <span data-design-text-token="label-md">Back to Sign In</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmailInput').value;
      document.getElementById('resetConfirmText').textContent = 'Instructions to reset your password have been sent to ' + email + '.';
      document.getElementById('resetConfirmation').classList.remove('hidden');
    }
  </script>


</body></html>
